<!doctype html>
<html lang="mn" data-light="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>M Atlas</title>
    <meta
      name="description"
      content="M Atlas is an illustrated field guide in two volumes, birds and myths, with interactive 3D specimens in English and Mongolian."
    />
    <meta property="og:title" content="M Atlas" />
    <meta
      property="og:description"
      content="M Atlas is an illustrated field guide in two volumes, birds and myths, with interactive 3D specimens in English and Mongolian."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%234d5a3d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-size='34' fill='%23f6f1e7'%3EM%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap"
    />
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var light = localStorage.getItem('matlas.light');
          if (light === 'dusk' || light === 'day') {
            root.setAttribute('data-light', light);
          }
          var params = new URLSearchParams(window.location.search);
          var qLang = params.get('lang');
          var lang = qLang === 'en' || qLang === 'mn' ? qLang : localStorage.getItem('matlas.lang');
          if (lang === 'en' || lang === 'mn') {
            root.lang = lang;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
